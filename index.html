<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Space - Cinema Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js" 
            onerror="document.getElementById('room-status').innerText = 'ERROR: NETWORK BLOCKED THE LIBRARY! Turn on VPN.'; document.getElementById('room-status').classList.replace('text-blue-500', 'text-red-500');">
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 'cute': ['Nunito', 'sans-serif'], 'pixel': ['"Press Start 2P"', 'cursive'] }
                }
            }
        }
    </script>

    <style>
        body { overflow: hidden; background-color: #000000; color: white; }
        .glass { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .speaking { box-shadow: 0 0 20px 3px rgba(59, 130, 246, 0.9); border-color: #3b82f6 !important; }
        .draggable-avatar { position: absolute; cursor: grab; z-index: 20; user-select: none; }
        .draggable-avatar:active { cursor: grabbing; z-index: 50; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="font-cute h-screen w-screen relative">

    <div id="login-screen" class="absolute inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-xl transition-opacity duration-500">
        <div class="glass p-10 rounded-3xl w-full max-w-md text-center flex flex-col items-center border border-white/5">
            <h1 class="text-3xl font-black text-white mb-2 tracking-tight">Vibe Space</h1>
            <p id="room-status" class="text-blue-500 font-bold mb-8 text-xs uppercase tracking-widest">INITIALIZING NETWORK...</p>
            
            <input type="text" id="username" placeholder="Collins" class="w-full px-6 py-4 rounded-2xl bg-[#0a0a0a] text-white border border-gray-800 focus:border-blue-500 outline-none text-lg mb-8 shadow-inner font-bold placeholder-gray-600">
            
            <div class="flex gap-4 mb-10">
                <button onclick="selectAvatar('duck')" id="btn-duck" class="avatar-btn w-16 h-16 rounded-2xl bg-[#111] border-2 border-transparent hover:border-blue-500 flex items-center justify-center text-3xl transition-all shadow-lg">🦆</button>
                <button onclick="selectAvatar('knight')" id="btn-knight" class="avatar-btn w-16 h-16 rounded-2xl bg-[#111] border-2 border-transparent hover:border-blue-500 flex items-center justify-center text-3xl transition-all shadow-lg">♘</button>
                <button onclick="selectAvatar('alien')" id="btn-alien" class="avatar-btn w-16 h-16 rounded-2xl bg-[#111] border-2 border-transparent hover:border-blue-500 flex items-center justify-center text-3xl transition-all shadow-lg">👾</button>
            </div>

            <button onclick="enterSpace()" id="join-btn" disabled class="w-full bg-white text-black hover:bg-gray-200 disabled:bg-gray-800 disabled:text-gray-500 font-black text-lg py-4 rounded-2xl transition-all shadow-xl">
                Enter Space
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden w-full h-full relative">
        <div id="video-layer" class="absolute inset-0 z-0 bg-black flex items-center justify-center"></div>

        <header id="header-ui" class="absolute top-6 left-6 right-6 flex justify-between items-start z-[60] pointer-events-none transition-opacity duration-300">
            <div class="flex flex-col gap-3 pointer-events-auto">
                <div class="glass flex items-center gap-3 px-4 py-3 rounded-2xl">
                    <div class="text-lg animate-pulse">📻</div>
                    <div class="w-32 overflow-hidden font-pixel text-[8px] text-gray-300">
                        <marquee scrollamount="3">Now Playing: Dave - Starlight 🎵</marquee>
                    </div>
                </div>
                <button onclick="copyRoomLink()" class="glass px-4 py-2 rounded-xl text-xs font-bold text-gray-300 hover:text-white transition-colors flex items-center gap-2">
                    <span class="material-icons text-sm">link</span> Copy Invite Link
                </button>
            </div>

            <div class="flex flex-col items-end gap-3 pointer-events-auto">
                <button onclick="toggleLowData()" id="data-btn" class="glass px-3 py-2 rounded-xl font-bold text-green-500 hover:bg-white/5 transition-all flex items-center gap-2 text-[10px] uppercase tracking-wider">
                    <span class="material-icons text-sm">network_check</span> <span id="data-text">Stable</span>
                </button>
                <video id="local-video" class="w-32 h-24 object-cover rounded-xl border border-gray-800 bg-[#0a0a0a] shadow-xl" autoplay muted playsinline></video>
            </div>
        </header>

        <button onclick="toggleCinemaMode()" id="cinema-exit-btn" class="hidden absolute top-6 right-6 z-[70] glass px-4 py-2 rounded-xl font-bold text-white hover:bg-white/10 transition-all flex items-center gap-2 text-xs shadow-2xl">
            <span class="material-icons text-sm">close_fullscreen</span> Exit Cinema Mode
        </button>

        <div id="avatar-space" class="absolute inset-0 z-20 pointer-events-none"></div>

        <div id="bottom-ui" class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-3 z-[60] w-full max-w-xl px-6 pointer-events-none">
            <div id="chat-log" class="w-full h-20 overflow-y-auto text-[11px] font-bold flex flex-col gap-1 pointer-events-auto mask-image: linear-gradient(to top, black 80%, transparent); text-shadow: 0 1px 2px rgba(0,0,0,0.8);"></div>

            <div class="flex gap-2 w-full pointer-events-auto items-center">
                <form onsubmit="sendChat(event)" class="flex-1 relative transition-all duration-300">
                    <input type="text" id="chat-input" placeholder="Type a thought..." class="w-full glass py-3 px-5 rounded-2xl text-white placeholder-gray-500 outline-none font-bold focus:border-white/30 transition-all text-sm shadow-xl focus:opacity-100 hover:opacity-100">
                    <button type="submit" class="absolute right-1 top-1 hover:bg-white/10 text-white p-2 rounded-xl transition-all">
                        <span class="material-icons text-sm">send</span>
                    </button>
                </form>

                <div id="media-dock" class="glass px-5 py-2 rounded-2xl flex items-center gap-4 shadow-xl transition-all duration-300 origin-right">
                    <button onclick="toggleMic()" id="mic-btn" class="text-gray-400 hover:text-white transition-colors p-1.5"><span class="material-icons text-xl">mic</span></button>
                    <button onclick="toggleVid()" id="vid-btn" class="text-gray-400 hover:text-white transition-colors p-1.5"><span class="material-icons text-xl">videocam</span></button>
                    <button onclick="startScreenShare()" class="text-purple-400 hover:text-purple-300 transition-colors p-1.5" title="Share Movie Screen"><span class="material-icons text-xl">present_to_all</span></button>
                    <div class="w-px h-5 bg-gray-700 mx-1"></div>
                    <button onclick="toggleCinemaMode()" class="text-blue-400 hover:text-blue-300 transition-colors p-1.5" title="Cinema Mode (Hide UI)"><span class="material-icons text-xl">theaters</span></button>
                    <div class="w-px h-5 bg-gray-700 mx-1"></div>
                    <button onclick="location.reload()" class="text-red-500 hover:text-red-400 p-1.5 transition-colors"><span class="material-icons text-xl">logout</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myId = null;
        let peer = null;
        let localStream = null;
        let screenStream = null;
        let connections = []; 
        let mediaCalls = [];  
        
        let profile = { name: "Guest", avatar: "duck" };
        let isLowData = false;
        let isAudioMuted = false;
        let isVideoOff = false;
        let isCinemaMode = false;

        const avatarMap = { 'duck': '🦆', 'knight': '♘', 'alien': '👾' };
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomToJoin = urlParams.get('room');

        window.onload = () => {
            const statusEl = document.getElementById('room-status');
            
            if (typeof Peer === 'undefined') {
                statusEl.innerText = "ERROR: CDN BLOCKED! Turn on VPN.";
                statusEl.classList.replace('text-blue-500', 'text-red-500');
                return;
            }

            statusEl.innerText = "Contacting Server & Relays...";

            try {
                // ADDED FREE TURN SERVERS TO BYPASS STRICT NIGERIAN NETWORKS
                peer = new Peer({ 
                    debug: 2,
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            {
                                urls: "turn:openrelay.metered.ca:80",
                                username: "openrelayproject",
                                credential: "openrelayproject"
                            },
                            {
                                urls: "turn:openrelay.metered.ca:443",
                                username: "openrelayproject",
                                credential: "openrelayproject"
                            },
                            {
                                urls: "turn:openrelay.metered.ca:443?transport=tcp",
                                username: "openrelayproject",
                                credential: "openrelayproject"
                            }
                        ]
                    }
                }); 
                
                peer.on('open', (id) => {
                    myId = id;
                    statusEl.innerText = "Network Ready!";
                    statusEl.classList.replace('text-blue-500', 'text-green-500');
                    document.getElementById('join-btn').disabled = false;
                });

                peer.on('error', (err) => {
                    console.error("PeerJS Error:", err);
                    if (err.type === 'peer-unavailable') {
                        // If they missed the host, retry silently
                        console.log("Host not found immediately, retrying connection...");
                    } else {
                        statusEl.innerText = "ERROR: " + err.type;
                        statusEl.classList.replace('text-blue-500', 'text-red-500');
                    }
                });

                peer.on('connection', (conn) => setupDataConnection(conn));
                peer.on('call', (call) => {
                    call.answer(localStream); 
                    handleCallStream(call);
                });

                setTimeout(() => {
                    if (!myId) {
                        statusEl.innerText = "BLOCKED BY NETWORK/ISP! Try a VPN.";
                        statusEl.classList.replace('text-blue-500', 'text-red-500');
                    }
                }, 8000);

            } catch (error) {
                statusEl.innerText = "CRASH: " + error.message;
                statusEl.classList.replace('text-blue-500', 'text-red-500');
            }
        };

        function selectAvatar(type) {
            profile.avatar = type;
            document.querySelectorAll('.avatar-btn').forEach(b => b.classList.replace('border-blue-500', 'border-transparent'));
            document.getElementById(`btn-${type}`).classList.replace('border-transparent', 'border-blue-500');
        }

        async function enterSpace() {
            const inputName = document.getElementById('username').value.trim();
            if(inputName) profile.name = inputName;
            if(!profile.avatar) return alert("Select an avatar!");

            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                spawnAvatarUI(myId, profile.name, profile.avatar, true);
            }, 500);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: { width: { ideal: 320 }, frameRate: { ideal: 15 } }
                });
                document.getElementById('local-video').srcObject = localStream;
                monitorVoiceActivity(localStream, myId);
            } catch (err) {
                console.error("Media Error:", err);
                localStream = new MediaStream();
            }

            // JOINING LOGIC WITH RETRIES
            if (roomToJoin && roomToJoin !== myId) {
                let attempts = 0;
                
                function attemptConnection() {
                    appendLog("System", `Connecting to host... (Attempt ${attempts + 1})`);
                    const conn = peer.connect(roomToJoin, { metadata: profile, reliable: true });
                    
                    conn.on('open', () => {
                        appendLog("System", "Data channel connected!");
                        setupDataConnection(conn);
                        
                        // Only try the media call after data channel succeeds
                        setTimeout(() => {
                            const call = peer.call(roomToJoin, localStream);
                            handleCallStream(call);
                        }, 500);
                    });

                    conn.on('error', () => {
                        attempts++;
                        if (attempts < 3) {
                            setTimeout(attemptConnection, 2000); // Retry after 2 seconds
                        } else {
                            appendLog("System", "Failed to connect to host. They might have left the room.");
                        }
                    });
                }
                
                attemptConnection();
            }
        }

        function copyRoomLink() {
            let path = window.location.pathname;
            if (!path.endsWith('/')) {
                path += '/';
            }
            const link = `${window.location.origin}${path}?room=${myId}`;
            navigator.clipboard.writeText(link);
            alert("Invite link copied! Send it over.");
        }

        function setupDataConnection(conn) {
            if (!connections.includes(conn)) {
                connections.push(conn);
            }
            
            // Send profile immediately if open, otherwise wait for open event
            if (conn.open) {
                conn.send({ type: 'profile', data: profile, peerId: myId });
            } else {
                conn.on('open', () => {
                    conn.send({ type: 'profile', data: profile, peerId: myId });
                });
            }

            conn.on('data', (payload) => {
                if (payload.type === 'profile') {
                    spawnAvatarUI(payload.peerId, payload.data.name, payload.data.avatar, false);
                } 
                else if (payload.type === 'chat') {
                    showSpeechBubble(payload.peerId, payload.msg);
                    appendLog(payload.sender, payload.msg);
                }
            });
            conn.on('close', () => {
                const el = document.getElementById(`avatar-${conn.peer}`);
                if(el) el.remove();
            });
        }

        function handleCallStream(call) {
            if (!mediaCalls.includes(call)) {
                mediaCalls.push(call);
            }
            call.on('stream', (remoteStream) => {
                let vidEl = document.getElementById(`vid-${call.peer}`);
                if (!vidEl) {
                    vidEl = document.createElement('video');
                    vidEl.id = `vid-${call.peer}`;
                    vidEl.className = "w-full h-full object-contain absolute inset-0";
                    vidEl.autoplay = true;
                    vidEl.playsinline = true;
                    document.getElementById('video-layer').appendChild(vidEl);
                }
                vidEl.srcObject = remoteStream;
                monitorVoiceActivity(remoteStream, call.peer);
            });
            call.on('close', () => {
                const vidEl = document.getElementById(`vid-${call.peer}`);
                if(vidEl) vidEl.remove();
            });
        }

        function broadcastData(type, data) {
            connections.forEach(conn => { if(conn.open) conn.send({ type, ...data }); });
        }

        function toggleCinemaMode() {
            isCinemaMode = !isCinemaMode;
            const header = document.getElementById('header-ui');
            const mediaDock = document.getElementById('media-dock');
            const exitBtn = document.getElementById('cinema-exit-btn');
            const chatInput = document.getElementById('chat-input');

            if (isCinemaMode) {
                header.classList.add('opacity-0', 'pointer-events-none');
                mediaDock.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
                
                setTimeout(() => {
                    header.classList.add('hidden');
                    mediaDock.classList.add('hidden');
                    exitBtn.classList.remove('hidden');
                }, 300);

                chatInput.classList.remove('glass');
                chatInput.classList.add('bg-black/40', 'backdrop-blur-sm', 'border', 'border-white/10', 'opacity-50');
            } else {
                header.classList.remove('hidden');
                mediaDock.classList.remove('hidden');
                exitBtn.classList.add('hidden');
                
                setTimeout(() => {
                    header.classList.remove('opacity-0', 'pointer-events-none');
                    mediaDock.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
                }, 10);

                chatInput.classList.remove('bg-black/40', 'backdrop-blur-sm', 'border', 'border-white/10', 'opacity-50');
                chatInput.classList.add('glass');
            }
        }

        function toggleMic() {
            isAudioMuted = !isAudioMuted;
            if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isAudioMuted);
            document.getElementById('mic-btn').innerHTML = `<span class="material-icons text-xl ${isAudioMuted ? 'text-red-500' : 'text-gray-400 hover:text-white'}">${isAudioMuted ? 'mic_off' : 'mic'}</span>`;
        }

        function toggleVid() {
            if(isLowData) return; 
            isVideoOff = !isVideoOff;
            if(localStream) localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
            document.getElementById('vid-btn').innerHTML = `<span class="material-icons text-xl ${isVideoOff ? 'text-red-500' : 'text-gray-400 hover:text-white'}">${isVideoOff ? 'videocam_off' : 'videocam'}</span>`;
        }

        async function startScreenShare() {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { width: { ideal: 1920 }, frameRate: { ideal: 30 } },
                    audio: true 
                });
                
                const screenVideoTrack = screenStream.getVideoTracks()[0];
                const screenAudioTrack = screenStream.getAudioTracks()[0]; 

                let myBigScreen = document.getElementById('my-big-screen');
                if(!myBigScreen) {
                    myBigScreen = document.createElement('video');
                    myBigScreen.id = 'my-big-screen';
                    myBigScreen.className = "w-full h-full object-contain absolute inset-0 z-10 bg-black";
                    myBigScreen.autoplay = true;
                    myBigScreen.muted = true; 
                    document.getElementById('video-layer').appendChild(myBigScreen);
                }
                myBigScreen.srcObject = screenStream;

                mediaCalls.forEach(call => {
                    const videoSender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(videoSender && screenVideoTrack) videoSender.replaceTrack(screenVideoTrack);
                    
                    if (screenAudioTrack) {
                        const audioSender = call.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                        if(audioSender) audioSender.replaceTrack(screenAudioTrack);
                    }
                });

                if(!isCinemaMode) toggleCinemaMode();

                screenVideoTrack.onended = () => {
                    if(myBigScreen) myBigScreen.remove();
                    
                    const camVideoTrack = localStream.getVideoTracks()[0];
                    const camAudioTrack = localStream.getAudioTracks()[0];
                    
                    mediaCalls.forEach(call => {
                        const videoSender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if(videoSender && camVideoTrack) videoSender.replaceTrack(camVideoTrack);
                        
                        const audioSender = call.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                        if(audioSender && camAudioTrack) audioSender.replaceTrack(camAudioTrack);
                    });
                };
            } catch (err) {
                console.log("Screenshare aborted or failed:", err);
            }
        }

        function toggleLowData() {
            isLowData = !isLowData;
            const btn = document.getElementById('data-btn');
            const text = document.getElementById('data-text');
            
            if (isLowData) {
                btn.classList.replace('text-green-500', 'text-red-500');
                text.innerText = "Low Data";
                if(localStream) localStream.getVideoTracks().forEach(t => t.enabled = false);
            } else {
                btn.classList.replace('text-red-500', 'text-green-500');
                text.innerText = "Stable";
                if(localStream && !isVideoOff) localStream.getVideoTracks().forEach(t => t.enabled = true);
            }
        }

        function sendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if(!msg) return;

            showSpeechBubble(myId, msg);
            appendLog("You", msg);
            broadcastData('chat', { msg: msg, peerId: myId, sender: profile.name });
            input.value = '';
        }

        function appendLog(sender, msg) {
            const log = document.getElementById('chat-log');
            const entry = document.createElement('div');
            entry.innerHTML = `<span class="text-white/50">${sender}:</span> <span class="text-white">${msg}</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function showSpeechBubble(peerId, text) {
            const container = document.getElementById(`avatar-inner-${peerId}`);
            if(!container) return;

            const old = container.querySelector('.speech-bubble');
            if(old) old.remove();

            const bubble = document.createElement('div');
            bubble.className = 'speech-bubble absolute -top-10 left-1/2 transform -translate-x-1/2 bg-white text-black px-3 py-1 rounded-xl font-bold shadow-2xl whitespace-nowrap z-50 text-[10px] transition-all';
            bubble.innerText = text;
            
            const pointer = document.createElement('div');
            pointer.className = 'absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-white rotate-45';
            bubble.appendChild(pointer);

            container.appendChild(bubble);
            setTimeout(() => { if(bubble.parentNode) bubble.remove(); }, 5000);
        }

        function makeDraggable(element) {
            let startX = 0, startY = 0;
            element.onmousedown = dragMouseDown;
            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                document.querySelectorAll('.draggable-avatar').forEach(el => el.style.zIndex = '20');
                element.style.zIndex = '50';
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                let dx = startX - e.clientX;
                let dy = startY - e.clientY;
                startX = e.clientX;
                startY = e.clientY;
                element.style.top = (element.offsetTop - dy) + "px";
                element.style.left = (element.offsetLeft - dx) + "px";
            }
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        function spawnAvatarUI(id, name, avatarType, isLocal) {
            const space = document.getElementById('avatar-space');
            if(document.getElementById(`avatar-${id}`)) return; 

            const outerWrapper = document.createElement('div');
            outerWrapper.id = `avatar-${id}`;
            outerWrapper.className = `draggable-avatar pointer-events-auto`;
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const offsetX = isLocal ? -40 : 40; 
            
            outerWrapper.style.left = `${(centerX + offsetX) - 30}px`; 
            outerWrapper.style.top = `${centerY - 30}px`;

            const innerWrapper = document.createElement('div');
            innerWrapper.id = `avatar-inner-${id}`;
            innerWrapper.className = `flex flex-col items-center animate-float relative`;

            const nameTag = document.createElement('div');
            nameTag.className = 'bg-black/80 text-white px-2 py-0.5 rounded-full text-[9px] font-bold mb-1 border border-white/10 shadow-lg pointer-events-none';
            nameTag.innerText = name + (isLocal ? " (You)" : "");

            const imgDiv = document.createElement('div');
            imgDiv.id = `ring-${id}`;
            imgDiv.className = 'w-14 h-14 bg-[#111] border border-gray-800 rounded-full flex items-center justify-center text-2xl shadow-xl transition-all duration-200';
            imgDiv.innerText = avatarMap[avatarType] || '👤';

            innerWrapper.appendChild(nameTag);
            innerWrapper.appendChild(imgDiv);
            outerWrapper.appendChild(innerWrapper);
            space.appendChild(outerWrapper);

            makeDraggable(outerWrapper);
        }

        function monitorVoiceActivity(stream, id) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyzer = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyzer);
                analyzer.fftSize = 256;
                const bufferLength = analyzer.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                setInterval(() => {
                    analyzer.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for(let i=0; i<bufferLength; i++) sum += dataArray[i];
                    let average = sum / bufferLength;

                    const ring = document.getElementById(`ring-${id}`);
                    if(ring) {
                        if(average > 15) ring.classList.add('speaking');
                        else ring.classList.remove('speaking');
                    }
                }, 100);
            } catch(e) { console.log("VAD not supported", e); }
        }
    </script>
